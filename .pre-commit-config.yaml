# Run through prek, not pre-commit: `prek run`, `prek install`. The file format is
# pre-commit's, which is why the filename is unchanged.
default_install_hook_types: [pre-commit, commit-msg, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # A snapshot records what another program emitted, so trailing whitespace in one is data. clap
      # pads help output with it, and stripping it makes the snapshot disagree with the `--help` it
      # was taken from — which is the whole assertion. Same reasoning as `.editorconfig`'s `[*.snap]`.
      - id: trailing-whitespace
        exclude: '\.snap$'
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      # The bound on what a commit may add to the pack, at the default 500 KB. --enforce-all
      # because `lint:data` runs it with --all-files, where nothing is staged and the default
      # filter to added-only would check nothing at all.
      - id: check-added-large-files
        args: [--enforce-all]
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint-system

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.17.0
    hooks:
      - id: commitizen
        stages: [commit-msg]

  - repo: local
    hooks:
      # The tripwire for a geospatial file arriving with nothing describing it: every input
      # dataset is a data/registry.toml row, so one with no row is either a generated product
      # that does not belong under data/ or an input nobody declared. The extension list lives
      # beside the check rather than in the registry, which describes the datasets that exist
      # rather than the formats one might arrive in.
      #
      # grep for the `path` line rather than a TOML parse, because a hook may not assume a
      # Python environment is built. That accepts a match inside a comment; the stem-equals-key
      # check in the Python boundary is what holds the row itself honest.
      - id: geo-data-registered
        name: geospatial data has a registry row
        language: system
        files: '(?i)\.(tiff?|jp2|ovr|img|ige|hgt|adf|grd|bil|bip|bsq|dt[012]|nc4?|hdf5?|h5|grib2?|grb2?|shp|shx|dbf|sbn|sbx|qix|atx|gpkg|fgb|mbtiles|pmtiles|kmz|pbf|parquet|las|laz|geojson)$'
        entry: >-
          bash -c 'rc=0; for f in "$@"; do
          grep -qF "path = \"$f\"" data/registry.toml && continue;
          echo "$f: no data/registry.toml row names this path.";
          echo "  fix: add a row for it, or publish it to a data tag and give the row a fetch_url";
          echo "  — ADR 0009 is which of those applies."; rc=1; done; exit $rc' --

      # ADR 0006 demoted `unsafe_code` from forbid to deny for one site, and `deny` is
      # overridable by definition — so this is what replaces the property `forbid` bought. It fails on a
      # second exception anywhere under crates/, and on the exception moving out of the file that record
      # reviewed. Zero fails too, and deliberately: an exception disappearing means the mapping went with
      # it, which is a decision to record rather than a tree to wave through. grep rather than rg
      # because a CI runner is not promised one.
      # The half of "never silence a lint with a blanket #[allow]" a machine can settle. A crate-level
      # `#![allow(…)]` exempts every item beneath it, including ones written later by someone who never
      # read the attribute; an item-level one cannot. So the shape is what gets checked, not the count —
      # a count would rise legitimately every time a module gains a test module of its own. `src` only:
      # `tests/` and `benches/` are where the blanket form is the right answer, and all ten of them live
      # there. Whether an item-level exception is narrow and justified stays a review question.
      - id: no-blanket-allow
        name: "no crate-level #![allow] under src"
        language: system
        types: [rust]
        pass_filenames: false
        entry: >-
          bash -c 'hits=$(grep -rn --include="*.rs" -F "#![allow(" crates/*/src || true);
          [ -z "$hits" ] && exit 0;
          echo "a crate-level #![allow] exempts every item beneath it, later ones included:";
          echo "$hits" | sed "s/^/  /";
          echo "  fix: move the exception onto the item that needs it, with a comment saying why;";
          echo "  docs/ai/code.md \"Comments and docs\" holds the rule."; exit 1' --

      - id: single-unsafe-allow
        name: "one unsafe exception, where ADR 0006 put it"
        language: system
        types: [rust]
        pass_filenames: false
        entry: >-
          bash -c 'site=crates/popcircles/src/table/cache.rs;
          count=$(grep -ro --include="*.rs" -F "allow(unsafe_code)" crates | wc -l | tr -d " ");
          where=$(grep -rl --include="*.rs" -F "allow(unsafe_code)" crates | tr "\n" " ");
          [ "$count" = 1 ] && [ "$where" = "$site " ] && exit 0;
          echo "ADR 0006 allows one #[allow(unsafe_code)], in $site.";
          echo "  found: $count, in: $where";
          echo "  fix: keep the exception where it was reviewed, or supersede ADR 0006.";
          exit 1'

      # No filenames: `cargo fmt --all` already covers every target in the workspace, and appending
      # the staged paths reaches rustfmt as extra inputs to a command that has already formatted them.
      #
      # An empty .rs file cannot get past this hook and end-of-file-fixer together: the fixer strips
      # the lone newline, rustfmt puts it back, and neither yields. A placeholder module needs a line
      # of content — a comment naming what the module will hold does.
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --all-targets --all-features -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false

      # `platform.md` says TOML is formatted with taplo, and until this hook existed nothing enforced
      # it: `mise run fmt` was the only caller, so drift surfaced as a diff nobody had authored. Local
      # and `language: system` so it is the mise-pinned binary rather than a second copy a remote hook
      # would install, and no filenames because `.taplo.toml`'s include list is what decides which TOML
      # is ours — passing paths bypasses it.
      - id: taplo-fmt
        name: taplo fmt
        entry: taplo fmt
        language: system
        types: [toml]
        pass_filenames: false

      # Args match the upstream hook's defaults; --files must stay last so pre-commit's
      # filenames land after it.
      - id: cspell
        name: cspell
        entry: cspell-cli
        language: system
        types: [text]
        args:
          - --no-must-find-files
          - --no-progress
          - --no-summary
          - --gitignore
          - --files

      # `.markdownlint-cli2.jsonc` owns which files and rules apply, so no args are needed here.
      - id: markdownlint-cli2
        name: markdownlint-cli2
        entry: markdownlint-cli2
        language: system
        types: [markdown]

      # FU-02 (docs/follow-ups.md). always_run because the Structure-tree half of the check
      # depends on the whole tree, not just Markdown — a new top-level file with no doc change
      # is exactly the case it exists to catch.
      - id: doc-pointers
        name: doc pointers and Structure tree resolve
        entry: uv run lint-docs
        language: system
        always_run: true
        pass_filenames: false

      # FU-03 and FU-06 (docs/follow-ups.md). A tripwire and not a lint: it cannot judge whether a
      # shape change was breaking, only that one landed under an unchanged version number.
      #
      # always_run rather than gated on the three trigger paths, measured on prek 0.4.13: a `files:`
      # hook is skipped when the only staged change is a deletion, and a deleted snapshot is a whole
      # payload type withdrawn. There is no `mise run lint:` half for the reason the others have one —
      # it reads the index against HEAD, so on a CI checkout, where nothing is staged, an --all-files
      # run would pass without checking anything and report a gate that had not run.
      - id: version-bumps
        name: a moved format shape bumps its version
        entry: uv run lint-version-bumps
        language: system
        always_run: true
        pass_filenames: false

      # main's ruleset carries one bypass actor, the Repository admin role, so the owner can push
      # straight to main and nobody else can. The three server-side checks never report on a commit
      # that arrived without a pull request, and this is what runs in their place: the same task CI
      # runs, before the push rather than after it.
      #
      # A guardrail and not a gate, the same way git:ff-only is one. `--no-verify` skips it, and it
      # tests the current branch rather than the refspec, so `git push origin HEAD:main` from
      # elsewhere is not seen. What it is for is the ordinary case of committing on main and pushing.
      - id: guard-direct-push
        name: a direct push to main runs ci first
        language: system
        stages: [pre-push]
        always_run: true
        pass_filenames: false
        entry: >-
          bash -c '[ "$(git rev-parse --abbrev-ref HEAD)" = main ] || exit 0;
          echo "pushing main directly: running mise run ci in place of the checks it skips";
          mise run ci'
