# Python is present for data preparation, map rendering and standalone tooling scripts. There is
# no importable package yet, so this is a virtual project: uv manages the environment and the dev
# tooling without building anything.
[project]
name = "population-circles-tools"
version = "0.0.0"
description = "Data preparation and map rendering tooling for PopulationCircles2026"
requires-python = ">=3.14"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = [
  "pyright>=1.1.407",
  "pytest>=9.0.2",
  "ruff>=0.16.2",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812", # conflicts with the formatter
  "CPY",    # no copyright headers anywhere in this repo
  "D",      # docstrings are not used in this repo
  # docs/ai/code.md: "No if TYPE_CHECKING: guard except to break an import cycle" — TC
  # exists to move imports behind that guard for other reasons, which this repo doesn't want.
  "TC",
]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = [
  "T201",   # a lint script's output is stdout, not incidental debug printing
  "INP001", # a standalone script, not part of a package
]
"tests/*.py" = [
  "S101",   # assert is how pytest asserts
  "INP001", # tests/ is pytest's testpaths, not a package
]

[tool.ruff.lint.isort]
known-first-party = ["population_circles"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
# tests/ imports the scripts/ modules directly, the same resolution pytest's `pythonpath` gives them.
extraPaths = ["scripts"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["scripts"]
