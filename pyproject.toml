# Python is present for data preparation, map rendering and standalone tooling scripts. There is
# no importable package yet, so this is a virtual project: uv manages the environment and the dev
# tooling without building anything.
[project]
name = "population-circles-tools"
version = "0.0.0"
description = "Data preparation and map rendering tooling for PopulationCircles2026"
requires-python = ">=3.14"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = [
  "cartopy>=0.25.0",
  "matplotlib>=3.11.1",
  "pydantic>=2.13.4",
  "pyproj>=3.7.2",
  "pyright>=1.1.407",
  "pytest>=9.0.2",
  "ruff>=0.16.2",
  "shapely>=2.1.2",
]

[tool.ruff]
line-length = 100
target-version = "py314"
# Beside cargo's target directory, which mise.toml sends here for the same reason.
cache-dir = "build/ruff"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812", # conflicts with the formatter
  "CPY",    # no copyright headers anywhere in this repo
  "D",      # docstrings are not used in this repo
  # docs/ai/code.md: "No if TYPE_CHECKING: guard except to break an import cycle" — TC
  # exists to move imports behind that guard for other reasons, which this repo doesn't want.
  "TC",
]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = [
  "T201",   # a lint script's output is stdout, not incidental debug printing
  "INP001", # a standalone script, not part of a package
]
"tests/*.py" = [
  "S101",   # assert is how pytest asserts
  "INP001", # tests/ is pytest's testpaths, not a package
]

[tool.ruff.lint.isort]
known-first-party = ["population_circles"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
# tests/ imports the scripts/ modules directly, the same resolution pytest's `pythonpath` gives them.
extraPaths = ["scripts"]
# cartopy ships no py.typed, so `import cartopy.crs` is reportMissingTypeStubs and every attribute
# off it is Unknown. typings/cartopy/ declares the handful of symbols the renderer uses; this is
# what makes them checked types rather than ignored lines.
stubPath = "typings"

[tool.pytest.ini_options]
# `-m "not network"` is the default selection, not a suggestion: the marked test fetches Natural
# Earth, and a suite CI runs may never reach the network. `mise run test:render` is what selects it.
addopts = '-ra --strict-markers --strict-config -m "not network"'
cache_dir = "build/pytest"
testpaths = ["tests"]
pythonpath = ["scripts"]
markers = [
  "network: reaches the network; deselected by default, run by `mise run test:render`",
]
