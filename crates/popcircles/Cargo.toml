[package]
name = "popcircles"
version.workspace = true
description = "Find the smallest circle on Earth containing a given share of world population"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# A release is a tag and attached binaries, and no registry. Enforced rather
# than intended, because `cargo publish` in either crate directory would otherwise attempt one.
publish = false

[lints]
workspace = true

[dependencies]
bytemuck.workspace = true
# The library emits diagnostics through the facade and never to a stream.
log.workspace = true
memmap2.workspace = true
serde.workspace = true
# A normal dependency rather than a dev one: the cache header is JSON, so the library writes and
# reads it rather than only serialising documents a caller prints.
serde_json.workspace = true
thiserror.workspace = true
tiff.workspace = true

[dev-dependencies]
insta.workspace = true
proptest.workspace = true
tempfile.workspace = true
weezl.workspace = true

# A benchmark is a `harness = false` target measuring with `std::time::Instant`, and
# adds no dependency. `test = false` on each is what keeps `cargo test` from running a benchmark as a
# test — with `harness = false` and no `main` that takes libtest's flags, a bench target under
# `cargo test` would fail on the arguments the harness passes it. `cargo clippy --all-targets` still
# compiles and lints all three.
[[bench]]
name = "table_build"
harness = false
test = false

[[bench]]
name = "kernel"
harness = false
test = false

[[bench]]
name = "circle"
harness = false
test = false
