[package]
name = "popcircles"
version = "0.0.0"
description = "Find the smallest circle on Earth containing a given share of world population"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
bytemuck.workspace = true
# ADR 0004 decision 1: the library emits diagnostics through the facade and never to a stream.
log.workspace = true
memmap2.workspace = true
serde.workspace = true
# A normal dependency from ADR 0003 decision 4 on: the cache header is JSON, so the library writes and
# reads it rather than only serialising documents a caller prints.
serde_json.workspace = true
thiserror.workspace = true
tiff.workspace = true

[dev-dependencies]
insta.workspace = true
proptest.workspace = true
tempfile.workspace = true
weezl.workspace = true
