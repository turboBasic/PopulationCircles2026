[package]
name = "popcircles-cli"
version.workspace = true
description = "CLI for finding the smallest circle on Earth containing a given share of world population"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# ADR 0006 decision 1, the same ruling the library carries: this crate cannot be published without
# the library going first, and neither is going.
publish = false

# ADR 0006 decision 4: without this the file takes the package name, and every document the CLI writes
# already reports `popcircles`. It is also what fixes the usage line, which clap takes from the binary
# rather than from `#[command(name = ...)]`.
[[bin]]
name = "popcircles"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
# Both ends of ADR 0004: this crate emits its own records and implements the `log::Log` that consumes
# every crate's.
log.workspace = true
popcircles = { path = "../popcircles" }
serde_json.workspace = true

# The one dev-dependency: `tests/commands.rs` builds a real cache to run the binary against, and a
# temporary directory is what keeps that out of the working tree. The binary itself is reached through
# `CARGO_BIN_EXE_*`, which is std, so no command runner is needed.
[dev-dependencies]
tempfile.workspace = true
