[tools]
# clippy and rustfmt are named explicitly: the default rustup profile on a CI runner
# does not install them, and `lint`/`fmt` need both.
rust = { version = "1.97.1", components = ["clippy", "rustfmt"] }
python = "3.14"
uv = "latest"
prek = "latest"
actionlint = "latest"
shellcheck = "latest"
taplo = "latest"
node = "24.19.0"
"npm:markdownlint-cli2" = "0.23.2"
"npm:cspell-cli" = "10.0.1"

[env]
_.python.venv = { path = ".venv", create = true }

[tasks.setup]
description = "Install dependencies and git hooks"
run = [
  "cargo fetch",
  "uv sync --locked",
  "prek install",
  "mise run data:skip",
  "mise run git:ff-only",
]

# A Git config setting overrides .lfsconfig, so a machine with a global lfs.fetchexclude
# ignores the committed one. Repo-local config beats global, which makes this the layer
# that actually holds. Clone-time is still on the user: GIT_LFS_SKIP_SMUDGE=1 git clone.
[tasks."data:skip"]
description = "Pin this clone to skip LFS data until data:pull asks for it"
run = "git config --local lfs.fetchexclude '*'"

# History is linear, and the ruleset on main is what enforces that. This only moves the failure
# earlier: the accidental merge — `git pull` or `git merge main` on a diverged branch — fails here
# instead of after a push, with nothing to rewrite. It is not a gate; `git merge --no-ff` overrides
# it. Repo-local like data:skip, because a developer's global preference is theirs to set.
#
# fetch.prune is here rather than in a task of its own because it corrects the same clone-side gap:
# the repository deletes a head branch when its PR merges, and without this the tracking ref for a
# branch that no longer exists survives every later fetch.
[tasks."git:ff-only"]
description = "Refuse to create a merge commit in this clone, and drop refs the remote deleted"
run = [
  "git config --local merge.ff only",
  "git config --local pull.ff only",
  "git config --local fetch.prune true",
]

# --release for the reason `test:raster` and `test:slow` carry it, and this task's only caller makes it
# safe: a person at a terminal. Nothing in CI, no task's `depends`, no hook and no test runs it. A pass
# over the registry raster takes seconds optimised and minutes unoptimised, so a debug build here is how
# a timing gets quoted an order of magnitude wrong. The cost is a slower compile after each edit, thin
# LTO included; a fast inner loop is `cargo run` directly.
[tasks.cli]
description = "Run the popcircles CLI, optimised"
run = "cargo run --release -p popcircles-cli --"

# The artifact a release attaches, at `target/release/popcircles`. `--locked` is what makes it provably
# the commit's: the release job publishes what this task builds, and without the flag cargo may update
# Cargo.lock during that build. The cost is that a manifest edit fails this task until `cargo` or `uv`
# has updated the lock, which `platform.md` "Dependencies" asks for anyway. `cli` runs the binary and
# builds it incidentally; this one is asked for the file.
[tasks.build]
description = "Build the release binary from the committed lock, at target/release/popcircles"
run = "cargo build --release --locked -p popcircles-cli"

# In neither `lint` nor `ci`, and not on a condition a later change could satisfy: `coastlines()`
# fetches Natural Earth from naturalearth.s3.amazonaws.com on first use, and nothing in CI may reach
# the network. `--no-coastlines` draws the cap without it, which is the shape `test:render`'s
# unmarked tests assert on; this task is the one a person runs to get a figure.
[tasks.render]
description = "Render a map from a popcircles JSON document"
run = "uv run python scripts/render_map.py"

[tasks.fmt]
description = "Format Rust, Python and TOML"
run = [
  "cargo fmt --all",
  "uv run ruff format .",
  "taplo fmt",
]

[tasks."lint:rust"]
description = "Lint Rust with clippy, warnings are errors"
run = "cargo clippy --all-targets --all-features -- -D warnings"

# FU-10's fix. Three flags, each load-bearing, because the obvious spelling of this task gates nothing:
# `-D warnings` because rustdoc *warns and exits 0*, so a task reading only the exit status passes a tree
# with broken links in it — measured before #8, where seven warnings sat under a green `mise run ci`.
# `--document-private-items` because without it rustdoc never reads a private item's doc comment, and this
# crate keeps most of its reasoning there; with the plain form, a broken link inside `report.rs`'s own
# helpers goes unreported. `--workspace` because the CLI has doc comments too.
#
# Two invocations rather than one `--workspace`, and the second's `--target-dir` is the whole point: since
# ADR 0006 decision 4 named the binary `popcircles`, the bin target and the library share a crate name and
# so `cargo doc --workspace` sends both to `target/doc/popcircles/` (cargo#6313). That is not the cosmetic
# warning it reads as — the two runs document concurrently, and the second deletes the directory the first
# is still writing into, which failed CI with `could not document popcircles` while passing locally, where
# the ordering happened to serialise. Documenting the CLI into a directory of its own keeps both halves the
# flags above are for: the library's rendered output, and the CLI's links checked too.
[tasks."lint:rustdoc"]
description = "Lint rustdoc, broken intra-doc links are errors"
env = { RUSTDOCFLAGS = "-D warnings" }
run = [
  "cargo doc -p popcircles --no-deps --document-private-items",
  "cargo doc -p popcircles-cli --no-deps --document-private-items --target-dir target/doc-cli",
]

[tasks."lint:python"]
description = "Lint Python with ruff"
run = "uv run ruff check ."

[tasks."lint:workflows"]
description = "Lint GitHub Actions workflows"
run = "actionlint"

# CI never runs prek, so the commit hooks would be local-only advice. This task selects the
# three data-integrity hooks by id and `lint` depends on it, which puts them in CI without a
# second copy of the logic: .pre-commit-config.yaml stays the only implementation.
# --all-files rather than the staged set, because on a CI checkout nothing is staged.
[tasks."lint:lfs"]
description = "Check geo data is LFS-tracked and no large blob is committed outside LFS"
run = "prek run --all-files check-added-large-files geo-data-lfs lfs-pointers"

# CI never runs prek, so the formatting hooks would be local-only advice. This task selects the
# three formatting hooks by id and `lint` depends on it, the same shape `lint:lfs` uses to put
# hooks in CI without a second copy of the logic. Those hooks rewrite rather than check, so a CI
# failure reads "files were modified by this hook" rather than naming the diff — the same report
# `lint:lfs` gives, and enough to stop the merge.
# --all-files rather than the staged set, because on a CI checkout nothing is staged.
[tasks."lint:format"]
description = "Check Rust, TOML and Python are formatted"
run = "prek run --all-files cargo-fmt taplo-fmt ruff-format"

# Puts the prek hook in CI; see `lint:lfs` for why. It matters more here than for the others: the hook
# is what stands in for `unsafe_code = "forbid"` (ADR 0003 decision 5), so a branch pushed from a clone
# where `prek install` never ran has to meet it too.
[tasks."lint:unsafe"]
description = "Check the one #[allow(unsafe_code)] is where ADR 0003 put it"
run = "prek run --all-files single-unsafe-allow"

# Puts the prek hook in CI; see `lint:lfs` for why.
[tasks."lint:markdown"]
description = "Lint Markdown with markdownlint-cli2"
run = "prek run --all-files markdownlint-cli2"

# Puts the prek hook in CI; see `lint:lfs` for why.
[tasks."lint:cspell"]
description = "Spell-check every tracked file with cspell"
run = "prek run --all-files cspell"

# Puts the prek hook in CI; see `lint:lfs` for why.
[tasks."lint:docs"]
description = "Check pointers and the Structure tree with scripts/lint_docs.py"
run = "prek run --all-files doc-pointers"

[tasks.lint]
description = "Run every linter"
depends = [
  "lint:rust",
  "lint:rustdoc",
  "lint:python",
  "lint:workflows",
  "lint:lfs",
  "lint:format",
  "lint:unsafe",
  "lint:markdown",
  "lint:cspell",
  "lint:docs",
]

[tasks.typecheck]
description = "Type-check Rust and Python"
depends = ["typecheck:python"]
run = "cargo check --all-targets --all-features"

[tasks."typecheck:python"]
description = "Type-check Python with pyright"
run = "uv run pyright"

[tasks.test]
description = "Run the Rust and Python test suites"
depends = ["test:python"]
run = "cargo test --all-features"

# Never in `lint` or `ci`, and not on a condition that could later be satisfied: CI clones with
# GIT_LFS_SKIP_SMUDGE=1, so data/ there holds pointers and this test would have nothing to read.
# --release because the pass is 933 120 000 cells and a debug build spends minutes on it. The
# deselected set is no longer only about data: it also holds `test:slow`'s test, which needs time and
# no raster, so this task runs that one too while `test:slow` runs it alone.
[tasks."test:raster"]
description = "Read the real population raster end to end (needs mise run data:pull)"
run = "cargo test --release --all-features -- --ignored"

# Not in `test` or `ci` for a reason `test:raster`'s data cannot be given: the shape is 933 120 000
# cells and the pass takes twenty seconds in release, minutes in a debug build, and a suite that slow
# stops being run. Selected by target rather than by name so adding a second slow test to the file
# needs no change here.
[tasks."test:slow"]
description = "Check the full-resolution summation table against an exact reference"
run = "cargo test --release --all-features --test full_resolution_table -- --ignored"

# Not in `test` or `ci` for `test:slow`'s reason and at a smaller scale: 74.7 MB of payload and a search
# over a whole globe. What it pins that the unit tests cannot is that the bound prunes at a size where
# pruning is the difference between seconds and hours, which is a claim about the algorithm rather than a
# wall clock — so it belongs in a task and not in a benchmark.
[tasks."test:search"]
description = "Search the decimated grid's shape and check the bound prunes most of the globe"
run = "cargo test --release --all-features --test decimated_search -- --ignored"

# Not in `test` or `ci` for `test:slow`'s reason at a smaller scale: 74.7 MB of payload and 9 331 200 cells
# streamed through the build, which is seconds of every run for a figure that moves only when the fold or
# the bound does. What it pins that the unit tests cannot is that `smallest`'s predicate slack bounds the
# fold's real error at a world's magnitude, where the sums round; on a fixture small enough for the default
# suite every partial sum is exact and there is nothing to measure. Selected by target, so a second test in
# the file needs no change here.
[tasks."test:fold"]
description = "Measure the circle fold's error at magnitude against the predicate slack it is bounded by"
run = "cargo test --release --all-features --test fold_at_magnitude -- --ignored"

# None of the four are in `lint`, `test` or `ci`, and not on a condition a later change could satisfy: a
# benchmark measures and asserts nothing, so there is no result for CI to be red about, and a figure
# measured on a shared runner would be noise quoted to three digits. ADR 0009 decision 1 is the shape —
# `harness = false` targets timing with `std::time::Instant`, no benchmark dependency — and ADR 0009's
# Context is where the figures these produced on one machine are recorded.
[tasks."bench:table"]
description = "Measure the summation table build, compensation and payload write separately"
run = "cargo bench --bench table_build"

[tasks."bench:kernel"]
description = "Measure circular kernel construction, the only step computing geodesic distance"
run = "cargo bench --bench kernel"

# Reports a resident figure always and a mapped one only when a full-resolution table is under `out/`,
# which it names the command for rather than building behind the caller. The pair is the point: at 7.5 GB
# a four-corner query is a page fault, and the resident figure alone describes a run nobody has.
[tasks."bench:circle"]
description = "Measure circle evaluation, resident and through a mapped full-resolution table"
run = "cargo bench --bench circle"

# `bench:table` is deliberately not in here: it writes a 7.5 GB payload to measure what the write costs,
# and a task that runs every benchmark should not be the one that fills a disk. Run it by name.
[tasks.bench]
description = "Run the benchmarks that write nothing"
depends = ["bench:kernel", "bench:circle"]

[tasks."test:python"]
description = "Run the Python test suite"
run = "uv run pytest"

# Not in `test` or `ci` for `test:raster`'s reason in another form: the marked test calls
# `coastlines()`, which fetches Natural Earth from naturalearth.s3.amazonaws.com, and nothing in CI
# may reach the network. Selected by marker rather than by file, so a second marked test needs no
# change here. `pyproject.toml`'s `addopts` is what deselects it everywhere else.
[tasks."test:render"]
description = "Render a full figure with coastlines (needs the network)"
run = "uv run pytest -m network"

[tasks.ci]
description = "Run everything CI runs, locally"
depends = ["lint", "typecheck", "test"]

[tasks."data:pull"]
description = "Fetch the Git LFS raster data that a normal clone deliberately skips"
run = "git lfs pull --include='*.tif' --exclude=''"

[tasks."data:status"]
description = "Show which LFS objects are present locally versus pointer-only"
run = "git lfs ls-files --size"
