[tools]
# clippy and rustfmt are named explicitly: the default rustup profile on a CI runner
# does not install them, and `lint`/`fmt` need both.
rust = { version = "1.97.1", components = ["clippy", "rustfmt"] }
python = "3.14"
uv = "latest"
prek = "latest"
actionlint = "latest"
shellcheck = "latest"
taplo = "latest"
node = "24.19.0"
"npm:markdownlint-cli2" = "0.23.2"
"npm:cspell-cli" = "10.0.1"
# Not `npm:opencode-ai`, though it is published there and the two lines above are how this file installs
# from npm: that package ships a stub whose postinstall fetches the real binary, and mise's npm backend
# runs no postinstall — the install reports success and every invocation then fails with "postinstall
# script was not run". The registry entry is `aqua:anomalyco/opencode`, which fetches the platform binary
# itself and needs no script.
#
# Pinned exactly, where most tools here take `latest`, because this one decides what a workflow does
# rather than whether a file is formatted: an agent whose behaviour moves under `agent-run.yml` produces a
# run nobody can reproduce, and the diff that changed it is not in this repository. Named here rather than
# installed in a workflow step so CI and a terminal get the same binary.
opencode = "1.18.18"

[env]
_.python.venv = { path = ".venv", create = true }

[tasks.setup]
description = "Install dependencies and git hooks"
run = [
  "cargo fetch",
  "uv sync --locked",
  "prek install",
  "mise run git:ff-only",
]

# main's ruleset is what enforces linear history; this makes the accidental merge fail earlier, at
# `git pull` or `git merge main` on a diverged branch, while there is nothing pushed to rewrite. It
# is not a second gate, because `git merge --no-ff` still overrides it. Repo-local rather than global,
# because a developer's own global preference is theirs to set.
#
# fetch.prune is here rather than in a task of its own because it closes the same kind of clone-side
# gap: the repository deletes a head branch when its PR merges, and without this the tracking ref for
# that branch survives every later fetch.
[tasks."git:ff-only"]
description = "Refuse to create a merge commit in this clone, and drop refs the remote deleted"
run = [
  "git config --local merge.ff only",
  "git config --local pull.ff only",
  "git config --local fetch.prune true",
]

# --release because a pass over the registry raster takes seconds optimised and minutes unoptimised, so
# a debug build here is how a timing gets quoted an order of magnitude wrong. Only a person at a
# terminal runs this task — no CI job, no `depends`, no hook, no test — so the slower compile after each
# edit, thin LTO included, is paid by whoever asked for the timing. `cargo run` is the fast inner loop.
[tasks.cli]
description = "Run the popcircles CLI, optimised"
run = "cargo run --release -p popcircles-cli --"

# The file a release attaches, at `build/target/release/popcircles`. `--locked` is what ties that
# file to the commit: the release job publishes what this task builds, and without the flag cargo may
# update Cargo.lock while building it. The cost is that a manifest edit fails this task until the lock
# has been updated. `cli` builds the binary incidentally; this task is asked for the file itself.
[tasks.build]
description = "Build the release binary from the committed lock, at build/target/release/popcircles"
run = "cargo build --release --locked -p popcircles-cli"

# Not in `lint` or `ci`, and for a reason that no longer has anything to do with the network: the
# basemap is committed, so a figure needs no download and the test suite draws complete ones. What
# this task does is write a file and assert nothing about it, which is the same reason the benchmarks
# are out. It is the one a person runs to get a figure at a path they chose.
[tasks.render]
description = "Render a map from a popcircles JSON document"
run = "uv run render-map"

[tasks.fmt]
description = "Format Rust, Python and TOML"
run = [
  "cargo fmt --all",
  "uv run ruff format .",
  "taplo fmt",
]

[tasks."lint:rust"]
description = "Lint Rust with clippy, warnings are errors"
run = "cargo clippy --all-targets --all-features -- -D warnings"

# Three flags, each load-bearing, because the obvious spelling of this task gates nothing. `-D warnings`
# because rustdoc warns and exits 0, so a task reading only the exit status passes a tree with broken
# links in it. `--document-private-items` because without it rustdoc never reads a private item's doc
# comment, and this crate keeps most of its reasoning there — a broken link inside `report.rs`'s own
# helpers would go unreported. Both crates, because the CLI has doc comments too.
#
# Two invocations rather than one `--workspace`, and the second's `--target-dir` is why. The binary and
# the library share the crate name `popcircles`, so `cargo doc --workspace` sends both to
# `build/target/doc/popcircles/` (cargo#6313). The two runs document concurrently, and the second
# deletes the directory the first is still writing into. Giving the CLI a directory of its own keeps
# both halves the flags above are for: the library's rendered output, and the CLI's links checked too.
[tasks."lint:rustdoc"]
description = "Lint rustdoc, broken intra-doc links are errors"
env = { RUSTDOCFLAGS = "-D warnings" }
run = [
  "cargo doc -p popcircles --no-deps --document-private-items",
  "cargo doc -p popcircles-cli --no-deps --document-private-items --target-dir {{config_root}}/build/target/doc-cli",
]

[tasks."lint:python"]
description = "Lint Python with ruff"
run = "uv run ruff check ."

[tasks."lint:workflows"]
description = "Lint GitHub Actions workflows"
run = "actionlint"

# CI never runs prek, so the commit hooks would be local-only advice. This task selects the
# two data-integrity hooks by id and `lint` depends on it, which puts them in CI without a
# second copy of the logic: .pre-commit-config.yaml stays the only implementation.
# --all-files rather than the staged set, because on a CI checkout nothing is staged.
[tasks."lint:data"]
description = "Check every geo data file has a registry row and no large blob is committed"
run = "prek run --all-files check-added-large-files geo-data-registered"

# CI never runs prek, so the formatting hooks would be local-only advice. This task selects the
# three formatting hooks by id and `lint` depends on it, the same shape `lint:data` uses to put
# hooks in CI without a second copy of the logic. Those hooks rewrite rather than check, so a CI
# failure reads "files were modified by this hook" rather than naming the diff — the same report
# `lint:data` gives, and enough to stop the merge.
# --all-files rather than the staged set, because on a CI checkout nothing is staged.
[tasks."lint:format"]
description = "Check Rust, TOML and Python are formatted"
run = "prek run --all-files cargo-fmt taplo-fmt ruff-format"

# Puts the prek hooks in CI; see `lint:data` for why. It matters more here than for the others: one of
# them stands in for `unsafe_code = "forbid"`, so a branch pushed from a clone where `prek install`
# never ran has to meet it too. Both hooks answer one question — what may silence a lint — which is why
# they share a task rather than each having one.
[tasks."lint:exemptions"]
description = "Check what may silence a lint: the one unsafe exception, and no blanket #![allow] in src"
run = "prek run --all-files single-unsafe-allow no-blanket-allow"

# Puts the prek hook in CI; see `lint:data` for why.
[tasks."lint:markdown"]
description = "Lint Markdown with markdownlint-cli2"
run = "prek run --all-files markdownlint-cli2"

# Puts the prek hook in CI; see `lint:data` for why.
[tasks."lint:cspell"]
description = "Spell-check every tracked file with cspell"
run = "prek run --all-files cspell"

# Puts the prek hook in CI; see `lint:data` for why.
[tasks."lint:docs"]
description = "Check pointers and the Structure tree with the lint-docs entry point"
run = "prek run --all-files doc-pointers"

[tasks.lint]
description = "Run every linter"
depends = [
  "lint:rust",
  "lint:rustdoc",
  "lint:python",
  "lint:workflows",
  "lint:data",
  "lint:format",
  "lint:exemptions",
  "lint:markdown",
  "lint:cspell",
  "lint:docs",
]

[tasks.typecheck]
description = "Type-check Rust and Python"
depends = ["typecheck:python"]
run = "cargo check --all-targets --all-features"

[tasks."typecheck:python"]
description = "Type-check Python with pyright"
run = "uv run pyright"

[tasks.test]
description = "Run the Rust and Python test suites"
depends = ["test:python"]
run = "cargo test --all-features"

# Never in `lint` or `ci`, and no later change can put it there: a CI checkout has no raster, so this
# test would have nothing to read. --release because the pass is
# 933 120 000 cells and a debug build spends minutes on it. `--ignored` selects every deselected test,
# `test:slow`'s among them, so this task runs that one too while `test:slow` runs it alone.
[tasks."test:raster"]
description = "Read the real population raster end to end (needs mise run data:get)"
run = "cargo test --release --all-features -- --ignored"

# Not in `test` or `ci`, for time rather than for data: the shape is 933 120 000 cells and the pass
# takes twenty seconds in release, minutes in a debug build, and a suite that slow stops being run.
# Selected by target rather than by name so adding a second slow test to the file needs no change here.
[tasks."test:slow"]
description = "Check the full-resolution summation table against an exact reference"
run = "cargo test --release --all-features --test full_resolution_table -- --ignored"

# Not in `test` or `ci` for time either, at a smaller scale: 74.7 MB of payload and a search over a whole
# globe. What it pins and the unit tests cannot is that the bound prunes at a size where pruning is the
# difference between seconds and hours. That is a claim about the algorithm rather than a wall clock,
# which is why it is a test and not a benchmark.
[tasks."test:search"]
description = "Search the decimated grid's shape and check the bound prunes most of the globe"
run = "cargo test --release --all-features --test decimated_search -- --ignored"

# Not in `test` or `ci` for time either: 74.7 MB of payload and 9 331 200 cells streamed through the
# build, which is seconds of every run for a figure that moves only when the fold or the bound does. What
# it pins and the unit tests cannot is that `smallest`'s predicate slack bounds the fold's real error at a
# world's magnitude, where the sums round; on a fixture small enough for the default suite every partial
# sum is exact and there is nothing to measure. Selected by target, so a second test in the file needs no
# change here.
[tasks."test:fold"]
description = "Measure the circle fold's error at magnitude against the predicate slack it is bounded by"
run = "cargo test --release --all-features --test fold_at_magnitude -- --ignored"

# Not in `test` or `ci` because it reads the registry raster, which a CI checkout does not have.
# It is the end-to-end one: the raster streamed into a table and the smallest circle holding half the
# world searched for over it, checked against the published prior art. Selected by target rather than by
# name so a second validation test needs no change here. When the raster is absent it skips
# with a message rather than failing, which is why running it on a fresh clone is harmless.
[tasks."test:validate"]
description = "Search the real raster for half the world and check it against the published result"
run = "cargo test --release --all-features --test registry_validation -- --ignored"

# None of the four are in `lint`, `test` or `ci`, and no later change can put them there: a benchmark
# measures and asserts nothing, so there is no result for CI to be red about, and a figure measured on a
# shared runner would be noise quoted to three digits. Each is a `harness = false` target timing with
# `std::time::Instant`, so no benchmark dependency is involved.
[tasks."bench:table"]
description = "Measure the summation table build, compensation and payload write separately"
run = "cargo bench --bench table_build"

[tasks."bench:kernel"]
description = "Measure circular kernel construction, the only step computing geodesic distance"
run = "cargo bench --bench kernel"

# Reports a resident figure always and a mapped one only when a full-resolution table is under `out/`,
# which it names the command for rather than building behind the caller. The pair is the point: at 7.5 GB
# a four-corner query is a page fault, and the resident figure alone describes a run nobody has.
[tasks."bench:circle"]
description = "Measure circle evaluation, resident and through a mapped full-resolution table"
run = "cargo bench --bench circle"

# `run` steps rather than `depends`, and that is the whole point of the task: `depends` resolves in
# parallel, so the two benchmarks would contend for the same cores and page cache and report figures
# nobody should quote — measured, the kernel numbers moved by more than a factor of two between a solo run
# and a concurrent one. Steps run in order, so each has the machine to itself.
#
# `bench:table` is deliberately not in here: it writes a 7.5 GB payload to measure what the write costs,
# and a task that runs every benchmark should not be the one that fills a disk. Run it by name.
[tasks.bench]
description = "Run the benchmarks that write nothing, one at a time"
run = ["mise run bench:kernel", "mise run bench:circle"]

[tasks."test:python"]
description = "Run the Python test suite"
run = "uv run pytest"

# Never in `test` or `ci`, and no later change can put it there: a CI checkout has no raster, so a length
# assertion against it would fail for having no file. The `-m`
# here overrides the one in pyproject.toml's addopts, the same way `--ignored` selects the deselected
# Rust tests.
[tasks."test:python-raster"]
description = "Check the registry's fetched rows against the files on disk (needs the raster present)"
run = "uv run pytest -m raster"

[tasks.ci]
description = "Run everything CI runs, locally"
depends = ["lint", "typecheck", "test"]

# Not in `ci` and no later change can put it there: it dispatches a workflow run and waits ten minutes on
# two runners, which is a thing a person asks for before a tag rather than something every pull request
# pays. It builds origin's ref and not this tree, so the script refuses a branch that is behind what is
# committed here.
#
# What it proves is that the release build compiles for `aarch64-apple-darwin`, which no other gate does.
# What it deliberately does not prove is the publish path: `release-smoke.yml` calls the same build a tag
# calls, and declares neither the gate nor the publish job.
[tasks."release:smoke"]
description = "Compile both release legs on demand, macOS included, publishing nothing"
run = "uv run release-smoke"

# Not in `lint`, `test` or `ci`, and no later change can put it there: it reaches the network, and a CI
# checkout deliberately has no raster.
[tasks."data:get"]
description = "Fetch every registered dataset not already present, verifying before it is placed"
run = "uv run fetch-data"
