# A call into turboBasic/github-actions now that its CI capability is bounded by the component rather
# than the language: it checks the tree out, installs what this repository's [tools] table pins, and runs
# `mise run lint`, `mise run typecheck` and `mise run test` — the same three tasks the inline job ran, so
# what CI runs and what `mise run ci` runs still cannot drift apart.
#
# The inline job also cached `~/.cargo/registry`, `~/.cargo/git` and `build/target` keyed on Cargo.lock,
# which the capability does not: it caches the hook runner and nothing else, and a caller cannot add a
# step to a job it does not own. Measured at about 24 seconds — FU-30 in docs/follow-ups.md.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # The id names the component and composes the required context `popcircles / project-ci`. One
  # component here, Rust and Python together, which is why it is named after neither.
  popcircles:
    uses: turboBasic/github-actions/.github/workflows/project-ci.yml@v0.3
    permissions:
      contents: read
    with:
      # `mise run ci` is lint, typecheck and test. The release binary is built by build-binaries.yml and
      # proven by release-smoke.yml, so a build stage here would compile the same tree a fourth time.
      run-build: false
