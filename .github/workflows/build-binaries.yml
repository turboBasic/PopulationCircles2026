# The heavy half of a release, called by release.yml on a tag and by release-smoke.yml on demand.
# ADR 0010: what the two scenarios differ in is what surrounds this, not this, so it exists once and
# neither caller carries a condition. Driven by mise tasks for ci.yml's reason — `mise run build` here,
# so what a tag builds cannot drift from what a clone builds.
#
# Every action is pinned to a full SHA, `actions/*` included. `platform.md` "CI" allows a version tag
# only for a reusable workflow call into turboBasic/github-actions, and there is no such call here.

name: Build binaries

on:
  workflow_call:

permissions:
  contents: read

env:
  # A caller's workflow-level env does not reach a called workflow, so this is declared here rather
  # than inherited: without it a build clones the rasters, which is minutes and hundreds of megabytes
  # on every leg.
  GIT_LFS_SKIP_SMUDGE: 1

jobs:
  build:
    name: Build ${{ matrix.triple }}
    runs-on: ${{ matrix.runner }}
    # Longer than the gate's because no gate has ever compiled this on macOS, so the release profile's
    # cost there — codegen-units = 1 and thin LTO — is unmeasured.
    timeout-minutes: 30
    strategy:
      # Both legs report. With fail-fast a macOS break would cancel the Linux leg, and the macOS runner is
      # the one nothing else in this repository exercises, so its failure is the one worth seeing whole.
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            triple: aarch64-apple-darwin
          - runner: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4

      # No cargo cache, unlike ci.yml: this artifact is downloaded and run by someone who cannot inspect
      # what produced it, and a tag is built once. Paying the full compile is worth not having to reason
      # about what a restored `target` contributed to it.
      - run: mise run build

      - name: Name the artifact by its target triple, with its checksum beside it
        env:
          TRIPLE: ${{ matrix.triple }}
        run: |
          set -euo pipefail
          cd target/release
          mv popcircles "popcircles-$TRIPLE"
          # sha256sum on the Linux runner, shasum on macOS, which ships no sha256sum.
          if command -v sha256sum > /dev/null 2>&1; then
            sha256sum "popcircles-$TRIPLE" > "popcircles-$TRIPLE.sha256"
          else
            shasum -a 256 "popcircles-$TRIPLE" > "popcircles-$TRIPLE.sha256"
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: popcircles-${{ matrix.triple }}
          path: |
            target/release/popcircles-${{ matrix.triple }}
            target/release/popcircles-${{ matrix.triple }}.sha256
          # A leg that built nothing must not reach publish as an empty upload.
          if-no-files-found: error
