# The gate in front of the agent: decides whether a comment may spend the provider key,
# `agent-run.yml` is what spends it. Runs no step of its own — a script here would be a place the
# comment body could reach.

name: Agent

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  # Both halves of the condition are load-bearing. The prefix is what makes an ordinary comment free;
  # author_association is what keeps a public repository's commenters away from a metered key and a
  # write-scoped token. OWNER is the only trusted value because one account has write access here.
  agent:
    if: >-
      startsWith(github.event.comment.body, '/agent')
      && github.event.comment.author_association == 'OWNER'
    uses: ./.github/workflows/agent-run.yml
    with:
      # The whole comment, unparsed: GitHub's expression language has neither `trim` nor `replace`, so
      # the called workflow strips the prefix in shell instead, where the body is data, not text about
      # to be interpolated.
      instruction: ${{ github.event.comment.body }}
      issue: ${{ github.event.issue.number }}
    # Named one by one rather than inherited: these three are every secret the repository has today, so
    # `inherit` would cost nothing now and would silently widen the agent's scope the moment a fourth is
    # added, with no diff in either workflow to show it.
    secrets:
      AGENT_APP_ID: ${{ secrets.AGENT_APP_ID }}
      AGENT_APP_PRIVATE_KEY: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
